[package]
name = "darkplayer"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.103"
eframe              = { version = "0.35.0", default-features = false, features = ["glow", "x11", "wayland"] }
egui                = "0.35.0"
egui_material_icons = { version = "0.7.0", default-features = false, features = ["outline"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
libmpv2             = "6.0.0"
libmpv2-sys         = "4.0.1"
log                 = "0.4"
pretty_env_logger   = "0.5"
serde = { version = "1.0.228", features = ["derive"] }
teloxide = "0.17.0"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros"] }
toml                = "1.1.3"
